name: Build (shared)

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      release-channel:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Probe for caller env (will be empty)
        run: |
          echo "CALLER_ENV inside reusable workflow: '$CALLER_ENV'"
          echo "(This is empty - reusable workflows do not inherit the caller's env)"

      - name: Show callee inputs
        run: |
          echo "target: ${{ inputs.target }}"
          echo "release-channel: ${{ inputs.release-channel }}"
