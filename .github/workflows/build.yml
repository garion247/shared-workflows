name: Build (shared)

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      # NEW REQUIRED INPUT — breaking change
      release-channel:
        required: true
        type: string
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          VERSION="2.0.${{ github.run_number }}+${{ inputs.target }}-${{ inputs.release-channel }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "v2 build: $VERSION"
